[project]
name = "repo-review"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = ["django>=5.2,<6", "httpx"]

[dependency-groups]
dev = [
    "pytest",
    "pytest-django",
    "pytest-env>=1.8.1",
    "respx",
    "ruff",
]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings"
testpaths = ["analysis"]
env = ["DJANGO_DEBUG=1"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "DJ"]
